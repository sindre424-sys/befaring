<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Sikkerhet: appen får bare laste filer fra seg selv og kan ikke sende data til noen server. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Befaring</title>
  <meta name="description" content="Feltregistrering for ingeniørgeologiske befaringer" />
  <meta name="theme-color" content="#16202a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Befaring" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Skjult felt som brukes for å holde tastaturet oppe på iPhone ved navigering -->
  <input id="fokus-proxy" aria-hidden="true" tabindex="-1" autocomplete="off" />
  <div id="app"><main class="innhold"><p>Laster …</p></main></div>
  <button id="oppdatering" hidden>Ny versjon er klar – trykk for å oppdatere</button>
  <noscript>Appen krever JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
